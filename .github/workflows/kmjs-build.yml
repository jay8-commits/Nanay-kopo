name: KMJS Build & Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KMJS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Diagnose Gradle Wrapper Checked Out by GitHub Actions
        run: |
          echo "=== PWD ==="
          pwd

          echo "=== Git Commit HEAD ==="
          git rev-parse HEAD

          echo "=== Git Status Short ==="
          git status --short

          echo "=== Directory Listing gradle/wrapper/ ==="
          ls -la gradle/wrapper/

          echo "=== File Details gradle-wrapper.jar ==="
          ls -l gradle/wrapper/gradle-wrapper.jar

          echo "=== File Type ==="
          file gradle/wrapper/gradle-wrapper.jar || true

          echo "=== SHA-256 Checksum ==="
          sha256sum gradle/wrapper/gradle-wrapper.jar || true

          echo "=== Unzip Test ==="
          unzip -t gradle/wrapper/gradle-wrapper.jar || true

          echo "=== Check GradleWrapperMain.class ==="
          unzip -l gradle/wrapper/gradle-wrapper.jar | grep GradleWrapperMain || true

          echo "=== Git ls-files ==="
          git ls-files -s gradle/wrapper/gradle-wrapper.jar || true

          echo "=== Git hash-object ==="
          git hash-object gradle/wrapper/gradle-wrapper.jar || true

          echo "=== .gitattributes Content ==="
          cat .gitattributes || true

          echo "=== gradle-wrapper.properties Content ==="
          cat gradle/wrapper/gradle-wrapper.properties || true

          echo "=== Test java -jar gradle-wrapper.jar ==="
          java -jar gradle/wrapper/gradle-wrapper.jar --help || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "KMJS APK generated successfully."
          ls -lh "$APK"

      - name: Generate SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
            > app/build/outputs/apk/debug/app-debug.apk.sha256

          cat app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload KMJS APK
        uses: actions/upload-artifact@v4
        with:
          name: KMJS-Virtual-Camera-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KMJS-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
